name: 发布独立离线手机版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 运行前端测试
        run: npm test
      - name: 验证 PWA 资源生成器
        run: node --test scripts/build-pwa-assets.test.mjs
      - name: 构建桌面资源与独立 PWA
        run: npm run build
      - name: 检查匿名信息和离线资源完整性
        run: npm run verify:mobile-bundle
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传手机版静态产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/mobile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到固定 HTTPS 地址
        id: deployment
        uses: actions/deploy-pages@v4
