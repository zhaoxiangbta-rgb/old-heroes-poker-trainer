name: 功能建议
description: 提出训练、策略、交互或桌面端功能建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望产品如何表现？
    validations:
      required: true
