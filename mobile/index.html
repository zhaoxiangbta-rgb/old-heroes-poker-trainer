<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07110d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="老英雄牌局" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>老英雄牌局 · 手机训练</title>
    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          var panel = document.querySelector("[data-mobile-boot]");
          if (panel) panel.innerHTML = "<strong>这是开发源文件，不是可运行的手机版</strong><br><small>请从电脑端“设置 → 手机访问”开启后，用手机打开显示的局域网地址。</small>";
        });
      }
    </script>
    <script src="/mobile-boot.js"></script>
    <link rel="stylesheet" href="/mobile-app.css" />
    <script defer src="/mobile-app.js"></script>
  </head>
  <body><div id="root"><div data-mobile-boot style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#d9aa4c;background:#030907;font:16px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;line-height:1.7"><span>手机牌局正在启动…</span><br><small style="color:#9aa79f">正在读取手机本地牌局</small></div></div><noscript><div style="padding:24px;color:#e8d3a0;background:#030907">需要开启 JavaScript 才能运行牌局。</div></noscript></body>
</html>
