<script data-mobile-entry-redirect>
  (() => {
    const handheld = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (handheld) window.location.replace(new URL("./mobile/", window.location.href));
  })();
</script>
